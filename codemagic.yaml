workflows:
  ios-workflow:
    name: Fai Fai Juice iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.faifaijuice.app
      node: latest
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          cd app/frontend
          npm install

      - name: Build web app
        script: |
          cd app/frontend
          npm run build

      - name: Sync Capacitor iOS
        script: |
          cd app/frontend
          npx cap sync ios

      - name: Set up code signing
        script: |
          cd app/frontend
          xcode-project use-profiles

      - name: Build IPA
        script: |
          cd app/frontend
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - app/frontend/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration