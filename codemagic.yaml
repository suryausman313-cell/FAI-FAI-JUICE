workflows:
  ios-workflow:
    name: Fai Fai Juice iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: latest
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          cd app/frontend
          npm install

      - name: Build web app
        script: |
          cd app/frontend
          npm run build

      - name: Sync Capacitor iOS
        script: |
          cd app/frontend
          npx cap sync ios

      - name: Build iOS
        script: |
          cd app/frontend
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build

    artifacts:
      - app/frontend/build/Build/Products/**/*.app
