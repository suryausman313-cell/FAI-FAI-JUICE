<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      data-mgx-overview="icon"
      rel="icon"
      href="/icon-192.png"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="theme-color"
      content="#dc2626"
    />

    <link
      id="app-manifest"
      rel="manifest"
      href="/manifest.json"
    />

    <title data-mgx-overview="title">
      Vita Napoli Pizza
    </title>

    <meta
      data-mgx-overview="description"
      name="description"
      content="Order authentic Italian pizza and pasta from Vita Napoli Pizza"
    />

    <meta
      name="author"
      content="Vita Napoli Pizza"
    />

    <meta
      data-mgx-overview="og:title"
      property="og:title"
      content="Vita Napoli Pizza"
    />

    <meta
      data-mgx-overview="og:description"
      property="og:description"
      content="Order authentic Italian pizza and pasta online"
    />

    <meta
      data-mgx-overview="og:image"
      property="og:image"
      content="/icon-512.png"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      data-mgx-overview="twitter:title"
      name="twitter:title"
      content="Vita Napoli Pizza"
    />

    <meta
      data-mgx-overview="twitter:description"
      name="twitter:description"
      content="Order authentic Italian pizza and pasta online"
    />

    <meta
      data-mgx-overview="twitter:image"
      name="twitter:image"
      content="/icon-512.png"
    />

    <script>
      (function () {
        const path = window.location.pathname;
        const manifestLink =
          document.getElementById("app-manifest");
        const titleElement =
          document.querySelector("title");
        const descriptionElement =
          document.querySelector(
            'meta[name="description"]'
          );

        let manifestUrl = "/manifest.json";
        let appTitle = "Vita Napoli Pizza";
        let appDescription =
          "Order authentic Italian pizza and pasta from Vita Napoli Pizza";

        if (path.startsWith("/admin")) {
          manifestUrl = "/manifest-admin.json";
          appTitle = "Vita Napoli Admin";
          appDescription =
            "Vita Napoli restaurant admin panel";
        } else if (path.startsWith("/kitchen")) {
          manifestUrl = "/manifest-kitchen.json";
          appTitle = "Vita Napoli Kitchen";
          appDescription =
            "Vita Napoli kitchen order panel";
        } else if (path.startsWith("/rider")) {
          manifestUrl = "/manifest-rider.json";
          appTitle = "Vita Napoli Rider";
          appDescription =
            "Vita Napoli rider delivery panel";
        }

        if (manifestLink) {
          manifestLink.setAttribute(
            "href",
            manifestUrl
          );
        }

        if (titleElement) {
          titleElement.textContent = appTitle;
        }

        if (descriptionElement) {
          descriptionElement.setAttribute(
            "content",
            appDescription
          );
        }

        document.documentElement.setAttribute(
          "data-app-manifest",
          manifestUrl
        );
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
