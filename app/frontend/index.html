<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link data-mgx-overview="icon" rel="icon" href="/icon-customer-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#15803d" />

    <script>
      (function () {
        var path = window.location.pathname.toLowerCase();
        var app = {
          manifest: '/manifest.json?v=20260804-role-icons-2',
          title: 'Fai Fai Juice',
          icon: '/icon-customer-192.png',
          theme: '#15803d'
        };

        if (path === '/admin' || path.indexOf('/admin/') === 0) {
          app = {
            manifest: '/manifest-admin.json?v=20260804-role-icons-2',
            title: 'Fai Fai Admin',
            icon: '/icon-admin-192.png?v=20260804-role-icons-2',
            theme: '#166534'
          };
        } else if (path === '/kitchen' || path.indexOf('/kitchen/') === 0) {
          app = {
            manifest: '/manifest-kitchen.json?v=20260804-role-icons-2',
            title: 'Fai Fai Kitchen',
            icon: '/icon-kitchen-192.png?v=20260804-role-icons-2',
            theme: '#ea580c'
          };
        } else if (path === '/rider' || path.indexOf('/rider/') === 0) {
          app = {
            manifest: '/manifest-rider.json?v=20260804-role-icons-2',
            title: 'Fai Fai Rider',
            icon: '/icon-rider-192.png?v=20260804-role-icons-2',
            theme: '#0369a1'
          };
        }

        var manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = app.manifest;
        document.head.appendChild(manifestLink);

        var iconLink = document.querySelector('link[rel="icon"]');
        if (iconLink) iconLink.setAttribute('href', app.icon);

        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) themeMeta.setAttribute('content', app.theme);

        document.title = app.title;
      })();
    </script>

    <title data-mgx-overview="title">Fai Fai Juice</title>
    <meta data-mgx-overview="description" name="description" content="Order fresh juices, desserts, mojitos and milkshakes from Fai Fai Juice" />
    <meta name="author" content="Fai Fai Juice" />
    <meta data-mgx-overview="og:title" property="og:title" content="Fai Fai Juice" />
    <meta data-mgx-overview="og:description" property="og:description" content="Fresh juices, desserts and beverages" />
    <meta data-mgx-overview="og:image" property="og:image" content="/icon-customer-512.png" />
    <meta property="og:type" content="website" />
    <meta data-mgx-overview="twitter:title" name="twitter:title" content="Fai Fai Juice" />
    <meta data-mgx-overview="twitter:description" name="twitter:description" content="Fresh juices, desserts and beverages" />
    <meta data-mgx-overview="twitter:image" name="twitter:image" content="/icon-customer-512.png" />

    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #030712; }
      body { min-height: 100vh; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
